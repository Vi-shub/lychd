version: 2

# Version-update PRs are paused during the solo-main phase.
# Restore positive limits when team integration starts (planned 2026-11-02).
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /clients/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 0
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 0
    groups:
      workflow-actions:
        patterns:
          - "*"
